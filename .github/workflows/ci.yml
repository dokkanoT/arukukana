name: CI

# PR を出したときと、main に入ったときに自動でチェックする
on:
  pull_request:
  push:
    branches: [main]

# 同じブランチに続けて push したら、古いほうの実行は止める
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# リポジトリの中身を読むだけ。書き込みの権限は渡さない
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # package-lock.json のとおりに入れる（手元と同じバージョンでチェックするため）
      - run: npm ci

      - run: npm run lint

      # 暗号・距離計算・合言葉のテスト
      - run: npm test

      # 型チェックと本番ビルド。Firebase の設定値はここでは要らない
      - run: npm run build
