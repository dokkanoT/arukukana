<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover：iPhone の画面下の横棒（ホームインジケータ）のぶんの余白を、CSS の
         env(safe-area-inset-bottom) で受け取れるようにする。これが無いと余白は常に 0 になる -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="その場所に着いたときだけ開ける手紙。いつもの帰り道を、1ミリ良くする。" />
    <meta name="theme-color" content="#0F1118" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <!-- iPhone のホーム画面に追加したときのアイコン -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- iPhone でホーム画面から開いたとき、アドレスバーを出さずにアプリのように開く。
         iPhone はマニフェストの display だけでは効かないことがあるので、Apple 独自の指定も書く -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="アルクカナ" />
    <!-- 上の時計や電池の帯を、夜色の画面に合わせて黒にする -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Old+Mincho:wght@400;700&display=swap"
    />
    <title>アルクカナ</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
