<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- 夜の地図の上に、手紙の灯りが 1 つ。端が丸く切り抜かれても欠けないよう、絵は中央に寄せてある -->
  <rect width="512" height="512" fill="#0F1118" />
  <circle cx="256" cy="256" r="150" fill="none" stroke="#E9B44C" stroke-opacity="0.35" stroke-width="6" stroke-dasharray="14 16" />
  <circle cx="256" cy="256" r="100" fill="#E9B44C" fill-opacity="0.16" />
  <circle cx="256" cy="256" r="60" fill="#E9B44C" fill-opacity="0.3" />
  <circle cx="256" cy="256" r="30" fill="#E9B44C" />
</svg>
